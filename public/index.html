<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MCG Intelligence Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .red { background-color: #b91c1c; }
    .green { background-color: #065f46; }
    .yellow { background-color: #92400e; }

    .large {
      font-size: 28px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<h1>MCG Intelligence System</h1>

<div class="card">
  <div id="signal"></div>
</div>

<div class="card">
  <table id="signal-table"></table>
</div>

<script>
fetch("./daily/latest.json")
  .then(res => res.json())
  .then(data => {

    const signalDiv = document.getElementById("signal");
    const table = document.getElementById("signal-table");

    // === FINAL ACTION DISPLAY ===
    let color = "yellow";
    if (data.final_action === "ADD") color = "green";
    if (data.final_action === "TRIM") color = "red";

    signalDiv.innerHTML = `
      <div class="large">Signal: 
        <span class="badge ${color}">
          ${data.final_action}
        </span>
      </div>
      <p>Date: ${data.date}</p>
    `;

    // === SHOCK MODE BADGE ===
    const shockBadge = data.shock_mode 
      ? `<span class="badge red">SHOCK MODE</span>`
      : `<span class="badge green">Normal</span>`;

    const weekendBadge = data.weekend_mode
      ? `<span class="badge yellow">Weekend Mode</span>`
      : `<span class="badge green">Weekday</span>`;

    // === BUILD TABLE ===
    const rows = [
      ["Macro Regime", data.macro_regime],
      ["BTC Above 50 DMA", data.btc_structure.above_50dma],
      ["BTC Above 200 DMA", data.btc_structure.above_200dma],
      ["Volatility Regime", data.btc_structure.volatility],
      ["ETF Flow Regime", data.institutional_flows.etf_flow_regime],
      ["Funding Regime", data.funding.funding_regime],
      ["PMI Trend", data.pmi?.pmi_trend || "N/A"],
      ["Fear & Greed", data.fear_greed ? 
          `${data.fear_greed.value} (${data.fear_greed.classification})`
          : "N/A"],
      ["Tactical Bias", data.tactical_bias || "N/A"],
      ["Shock Mode", shockBadge],
      ["Weekend Mode", weekendBadge]
    ];

    rows.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><strong>${row[0]}</strong></td><td>${row[1]}</td>`;
      table.appendChild(tr);
    });

  });
</script>

</body>
</html>
