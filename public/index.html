<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCG Intelligence System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --border: #334155;
}

.light-mode {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --border: #e2e8f0;
}

body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s ease;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 40px;
}

.card {
  background: var(--card);
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 16px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.row:last-child {
  border-bottom: none;
}

.badge {
  padding: 6px 12px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
}

.green { background: var(--green); color: white; }
.yellow { background: var(--yellow); color: white; }
.red { background: var(--red); color: white; }

.confidence-bar {
  height: 10px;
  border-radius: 6px;
  background: var(--border);
  overflow: hidden;
  margin-top: 10px;
}

.confidence-fill {
  height: 100%;
  transition: width 0.6s ease;
}

.toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  cursor: pointer;
  font-size: 14px;
  background: var(--card);
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

@media print {
  body { background: white; color: black; }
  .toggle { display: none; }
  .card { box-shadow: none; }
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">Toggle Theme</div>

<div class="container">
  <h1>MCG Intelligence System</h1>

  <div id="dashboard"></div>
</div>

<script>
function toggleMode() {
  document.body.classList.toggle("light-mode");
}

function getRiskClass(action) {
  if (action === "ADD") return "green";
  if (action === "TRIM") return "red";
  return "yellow";
}

function confidenceScore(data) {
  let score = 50;

  if (data.fear_greed?.value <= 20) score += 15;
  if (data.shock_mode) score -= 10;
  if (data.btc_structure.volatility === "high") score -= 10;
  if (data.institutional_flows.etf_flow_regime === "positive") score += 10;

  return Math.max(0, Math.min(100, score));
}

fetch("./daily/latest.json")
  .then(res => res.json())
  .then(data => {

    const riskClass = getRiskClass(data.final_action);
    const confidence = confidenceScore(data);

    const dashboard = document.getElementById("dashboard");

    dashboard.innerHTML = `

      <div class="card">
        <div class="section-title">Core Decision</div>
        <div class="row">
          <div>Date</div>
          <div>${data.date}</div>
        </div>
        <div class="row">
          <div>Macro Regime</div>
          <div>${data.macro_regime}</div>
        </div>
        <div class="row">
          <div>Final Action</div>
          <div class="badge ${riskClass}">${data.final_action}</div>
        </div>
        <div class="row">
          <div>Shock Mode</div>
          <div>${data.shock_mode ? '<span class="badge red">ACTIVE</span>' : 'Normal'}</div>
        </div>

        <div class="section-title" style="margin-top:20px;">Confidence</div>
        <div>${confidence}%</div>
        <div class="confidence-bar">
          <div class="confidence-fill ${riskClass}" style="width:${confidence}%"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">BTC Market Structure</div>
        <div class="row"><div>Above 50DMA</div><div>${data.btc_structure.above_50dma}</div></div>
        <div class="row"><div>Above 200DMA</div><div>${data.btc_structure.above_200dma}</div></div>
        <div class="row"><div>Volatility</div><div>${data.btc_structure.volatility}</div></div>
      </div>

      <div class="card">
        <div class="section-title">Institutional Flows</div>
        <div class="row"><div>ETF Flow Regime</div><div>${data.institutional_flows.etf_flow_regime}</div></div>
        <div class="row"><div>Funding</div><div>${data.funding.funding_regime}</div></div>
      </div>

      <div class="card">
        <div class="section-title">Sentiment Overlay</div>
        <div class="row">
          <div>Fear & Greed</div>
          <div>${data.fear_greed?.value} (${data.fear_greed?.classification})</div>
        </div>
        <div class="row">
          <div>Tactical Bias</div>
          <div>${data.tactical_bias}</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Macro Context (PMI)</div>
        <div class="row"><div>PMI</div><div>${data.pmi?.pmi}</div></div>
        <div class="row"><div>3M Avg</div><div>${data.pmi?.pmi_3m_avg}</div></div>
        <div class="row"><div>Trend</div><div>${data.pmi?.pmi_trend}</div></div>
      </div>

    `;
  });
</script>

</body>
</html>
