<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCG Intelligence Dashboard</title>

<style>
:root {
  --bg: #0f1115;
  --card: #161a22;
  --text: #e6e9ef;
  --muted: #9aa3b2;

  --green: #2ecc71;
  --yellow: #f1c40f;
  --red: #e74c3c;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1100px;
  margin: 60px auto;
  padding: 20px;
}

h1 {
  font-weight: 600;
  letter-spacing: 0.5px;
}

.card {
  background: var(--card);
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.value {
  font-size: 18px;
  font-weight: 600;
}

.badge {
  padding: 6px 12px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
  display: inline-block;
}

.green { background: rgba(46,204,113,0.15); color: var(--green); }
.yellow { background: rgba(241,196,15,0.15); color: var(--yellow); }
.red { background: rgba(231,76,60,0.15); color: var(--red); }

.section-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <h1>MCG Intelligence</h1>
  </div>

  <!-- HEADER SUMMARY -->
  <div class="card">
    <div class="section-title">Summary</div>
    <div class="grid">
      <div>
        <div class="label">Date</div>
        <div class="value" id="date"></div>
      </div>
      <div>
        <div class="label">Final Action</div>
        <div class="value" id="final-action"></div>
      </div>
      <div>
        <div class="label">Macro Regime</div>
        <div class="value" id="macro"></div>
      </div>
      <div>
        <div class="label">Data Health</div>
        <div id="health"></div>
      </div>
    </div>
  </div>

  <!-- RISK FLAGS -->
  <div class="card">
    <div class="section-title">Risk Flags</div>
    <div class="grid">
      <div>
        <div class="label">Shock Mode</div>
        <div id="shock"></div>
      </div>
      <div>
        <div class="label">Weekend Mode</div>
        <div id="weekend"></div>
      </div>
      <div>
        <div class="label">Fear & Greed</div>
        <div id="fg"></div>
      </div>
      <div>
        <div class="label">Tactical Bias</div>
        <div class="value" id="tactical"></div>
      </div>
    </div>
  </div>

  <!-- MARKET STRUCTURE -->
  <div class="card">
    <div class="section-title">Market Structure</div>
    <div class="grid">
      <div>
        <div class="label">50 DMA</div>
        <div class="value" id="dma50"></div>
      </div>
      <div>
        <div class="label">200 DMA</div>
        <div class="value" id="dma200"></div>
      </div>
      <div>
        <div class="label">Volatility Regime</div>
        <div class="value" id="vol"></div>
      </div>
      <div>
        <div class="label">ETF Flow Regime</div>
        <div class="value" id="etf"></div>
      </div>
      <div>
        <div class="label">Funding Regime</div>
        <div class="value" id="funding"></div>
      </div>
    </div>
  </div>

</div>

<script>

function badge(type, text) {
  return `<span class="badge ${type}">${text}</span>`;
}

function actionColor(action) {
  if (action === "ADD") return "green";
  if (action === "TRIM") return "red";
  return "yellow";
}

fetch("./daily/latest.json?v=" + new Date().getTime())
  .then(res => res.json())
  .then(data => {

    // Summary
    document.getElementById("date").innerText = data.date;

    const actionEl = document.getElementById("final-action");
    actionEl.innerText = data.final_action;
    actionEl.classList.add(actionColor(data.final_action));

    document.getElementById("macro").innerText = data.macro_regime;

    // Data health
    if (data.data_health === "healthy") {
      document.getElementById("health").innerHTML = badge("green", "Healthy");
    } else {
      document.getElementById("health").innerHTML = badge("red", "Degraded");
    }

    // Shock
    if (data.shock?.shock_mode) {
      document.getElementById("shock").innerHTML =
        badge("red", "ACTIVE") +
        `<div style="margin-top:6px;font-size:12px;color:#9aa3b2;">
          24h: ${(data.shock.pct_change_24h * 100).toFixed(2)}%<br>
          Range: ${(data.shock.intraday_range * 100).toFixed(2)}%
        </div>`;
    } else {
      document.getElementById("shock").innerHTML = badge("green", "Inactive");
    }

    // Weekend
    document.getElementById("weekend").innerHTML =
      data.weekend_mode
        ? badge("yellow", "Soft Mode")
        : badge("green", "Normal");

    // Fear & Greed
    if (data.fear_greed && data.fear_greed.value !== null) {
      const fgVal = data.fear_greed.value;
      let color = "yellow";
      if (fgVal <= 25) color = "green";
      if (fgVal >= 75) color = "red";

      document.getElementById("fg").innerHTML =
        badge(color, `${fgVal} (${data.fear_greed.classification})`);
    } else {
      document.getElementById("fg").innerHTML = badge("yellow", "Unavailable");
    }

    document.getElementById("tactical").innerText =
      data.tactical_bias || "N/A";

    // Structure
    document.getElementById("dma50").innerText =
      data.btc_structure.above_50dma;

    document.getElementById("dma200").innerText =
      data.btc_structure.above_200dma;

    document.getElementById("vol").innerText =
      data.btc_structure.volatility;

    document.getElementById("etf").innerText =
      data.institutional_flows.etf_flow_regime;

    document.getElementById("funding").innerText =
      data.funding.funding_regime;

  });

</script>

</body>
</html>
