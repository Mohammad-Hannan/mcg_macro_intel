<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCG Intelligence</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* --- styles unchanged --- */
:root {
  --bg:#0b0f17;
  --panel:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.08);
  --text:#e8ecf1;
  --muted:#98a2b3;
  --green:#3ddc97;
  --yellow:#facc15;
  --red:#f87171;
}

body{
margin:0;
background:radial-gradient(circle at top left,#111827,#0b0f17 60%);
color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:1250px;
margin:80px auto;
padding:0 30px;
}

.panel{
background:var(--panel);
border:1px solid var(--border);
backdrop-filter:blur(20px);
border-radius:18px;
padding:40px;
margin-bottom:40px;
}

.hero-grid{
display:grid;
grid-template-columns:1.5fr 1fr;
gap:60px;
align-items:center;
}

.headline{
font-size:64px;
font-weight:600;
}

.meta-grid,.grid{
display:grid;
gap:30px;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}

.label{
font-size:12px;
text-transform:uppercase;
color:var(--muted);
}

.bar-container{
height:8px;
background:rgba(255,255,255,0.08);
border-radius:6px;
overflow:hidden;
margin-top:16px;
}

.bar{
height:100%;
transition:width .6s ease;
}
</style>
</head>

<body>

<div class="container">
<h1>MCG Intelligence</h1>

<div class="panel">
<div class="hero-grid">

<div>
<div class="subtle">Bitcoin Allocation Target</div>
<div class="headline" id="allocation"></div>
<div class="bar-container">
<div id="allocation-bar" class="bar"></div>
</div>
<div class="subtle" id="structural"></div>
</div>

<div>
<div class="subtle">Macro Risk Gauge</div>
<div class="headline" id="mrg-hero"></div>
<div id="risk-level"></div>

<div class="subtle">Risk Regime</div>
<div id="risk-regime"></div>
</div>

</div>
</div>

<div class="panel">
<div class="subtle">Macro Risk Trend (30d)</div>
<canvas id="mrgChart" height="120"></canvas>
</div>

<div class="panel">
<div class="meta-grid">
<div><div class="label">Date</div><div id="date"></div></div>
<div><div class="label">Macro Regime</div><div id="macro"></div></div>
<div><div class="label">Fear & Greed</div><div id="fg"></div></div>
<div><div class="label">Tactical Bias</div><div id="tactical"></div></div>
<div><div class="label">Overlay Version</div><div id="version"></div></div>
</div>
</div>

<div class="panel">
<div class="grid">
<div><div class="label">CRS</div><div id="crs"></div></div>
<div><div class="label">LRS</div><div id="lrs"></div></div>
<div><div class="label">MRG</div><div id="mrg-breakdown"></div></div>
</div>
</div>

</div>

<script>

function riskColor(mrg){
if(mrg>=70) return "var(--red)";
if(mrg<=30) return "var(--green)";
return "var(--yellow)";
}

fetch("https://mohammad-hannan.github.io/mcg_macro_intel/daily/latest.json?v="+Date.now())
.then(res=>res.json())
.then(data=>{

const portfolio=data.portfolio_signal||{};
const risk=data.risk_engine||{};
const overlay=data.overlay||{};
const phase2=data.phase2||{};

const mrg=risk.mrg||0;
const exposure=overlay.exposure_recommendation||0;

document.getElementById("allocation").innerText=portfolio.btc_allocation_target||"—";

let arrow="→";
if(mrg>=70) arrow="↑";
if(mrg<=30) arrow="↓";

document.getElementById("mrg-hero").innerHTML=
`${mrg.toFixed(2)} <span style="font-size:28px">${arrow}</span>`;

document.getElementById("risk-level").innerText=portfolio.risk_level||"";

document.getElementById("risk-regime").innerText=portfolio.risk_level||"";

document.getElementById("structural").innerText=portfolio.structural_regime||"";

document.getElementById("date").innerText=data.date||"";
document.getElementById("macro").innerText=data.macro_regime||"";
document.getElementById("version").innerText=portfolio.overlay_version||"";

if(data.fear_greed){
document.getElementById("fg").innerText=
`${data.fear_greed.value} (${data.fear_greed.classification})`;
}

document.getElementById("tactical").innerText=data.tactical_bias||"";

document.getElementById("crs").innerText=risk.crs;
document.getElementById("lrs").innerText=risk.lrs;
document.getElementById("mrg-breakdown").innerText=mrg;

const bar=document.getElementById("allocation-bar");
bar.style.width=(exposure*100)+"%";
bar.style.background=riskColor(mrg);

if(data.mrg_history){

const labels=data.mrg_history.map(x=>x.date);
const values=data.mrg_history.map(x=>x.mrg);

new Chart(document.getElementById("mrgChart"),{
type:"line",
data:{
labels:labels,
datasets:[{
data:values,
borderWidth:2,
tension:0.4
}]
},
options:{
plugins:{legend:{display:false}},
scales:{y:{min:0,max:100}}
}
});

}

});

</script>

</body>
</html>
