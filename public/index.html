<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCG Intelligence System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    .primary {
      text-align: center;
      padding: 40px;
    }

    .decision-badge {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .HOLD { background: #475569; }
    .ADD { background: #065f46; }
    .TRIM { background: #7f1d1d; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .value {
      font-size: 20px;
      font-weight: 600;
    }

    .section-title {
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }

    .row:last-child {
      border-bottom: none;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #64748b;
    }

    .badge-red {
      color: #ef4444;
      font-weight: 600;
    }

    .badge-green {
      color: #22c55e;
      font-weight: 600;
    }

  </style>
</head>

<body>

<h1>MCG Intelligence System</h1>

<div class="container">

  <!-- PRIMARY DECISION -->
  <div class="card primary">
    <div id="decision" class="decision-badge">Loading...</div>
    <div id="decision-date"></div>
    <div id="macro-regime"></div>
  </div>

  <!-- RISK OVERVIEW -->
  <div class="grid">

    <div class="card">
      <div class="label">Shock Mode</div>
      <div id="shock-mode" class="value"></div>
    </div>

    <div class="card">
      <div class="label">Fear & Greed</div>
      <div id="fear-greed" class="value"></div>
    </div>

    <div class="card">
      <div class="label">Tactical Bias</div>
      <div id="tactical-bias" class="value"></div>
    </div>

    <div class="card">
      <div class="label">Volatility Regime</div>
      <div id="volatility" class="value"></div>
    </div>

  </div>

  <!-- MARKET STRUCTURE -->
  <div class="card">
    <div class="section-title">BTC Market Structure</div>
    <div class="row"><span>Above 50DMA</span><span id="ma50"></span></div>
    <div class="row"><span>Above 200DMA</span><span id="ma200"></span></div>
  </div>

  <!-- FLOWS -->
  <div class="card">
    <div class="section-title">Institutional Flows</div>
    <div class="row"><span>ETF Flow Regime</span><span id="etf"></span></div>
    <div class="row"><span>Funding Regime</span><span id="funding"></span></div>
  </div>

  <!-- PMI -->
  <div class="card">
    <div class="section-title">Macro Context (PMI)</div>
    <div class="row"><span>PMI</span><span id="pmi"></span></div>
    <div class="row"><span>3M Average</span><span id="pmi-avg"></span></div>
    <div class="row"><span>Trend</span><span id="pmi-trend"></span></div>
  </div>

</div>

<div class="footer">
  MCG Intelligence System — Institutional Decision Engine
</div>

<script>
fetch("./daily/latest.json?" + new Date().getTime())
  .then(res => res.json())
  .then(data => {

    const decision = document.getElementById("decision");
    decision.innerText = data.final_action;
    decision.classList.add(data.final_action);

    document.getElementById("decision-date").innerText = "Date: " + data.date;
    document.getElementById("macro-regime").innerText = "Macro Regime: " + data.macro_regime;

    document.getElementById("shock-mode").innerHTML =
      data.shock_mode ? "<span class='badge-red'>ACTIVE</span>" : "Normal";

    document.getElementById("fear-greed").innerText =
      data.fear_greed.value + " (" + data.fear_greed.classification + ")";

    document.getElementById("tactical-bias").innerText = data.tactical_bias;

    document.getElementById("volatility").innerText = data.btc_structure.volatility;

    document.getElementById("ma50").innerText = data.btc_structure.above_50dma;
    document.getElementById("ma200").innerText = data.btc_structure.above_200dma;

    document.getElementById("etf").innerText =
      data.institutional_flows.etf_flow_regime;

    document.getElementById("funding").innerText =
      data.funding.funding_regime;

    document.getElementById("pmi").innerText = data.pmi.pmi;
    document.getElementById("pmi-avg").innerText = data.pmi.pmi_3m_avg;
    document.getElementById("pmi-trend").innerText = data.pmi.pmi_trend;

  });
</script>

</body>
</html>
